[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gate"
version = "0.1.0"
description = "Refuse model findings whose quotes were never shown to the model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "code-review", "evaluation", "hallucination", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

# No [project.urls] yet.  A placeholder URL in published metadata is a dead
# link that outlives the mistake, and this project's whole argument is that an
# unchecked claim is worse than an absent one.  Added when a canonical home
# exists.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_gate = ["py.typed"]
